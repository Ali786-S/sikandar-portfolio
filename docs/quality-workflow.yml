name: Portfolio quality
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - name: Start production server and test routes
        run: |
          npm start > /tmp/portfolio.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000 > /dev/null && break || sleep 1; done
          npm test
